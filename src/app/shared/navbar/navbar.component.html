<nav class="navbar">

  <a routerLink="/" id="brand">
    <div id="logo">
      <img src="/images/logo.svg" alt="Logo">
    </div>

    <span id="brand-title">
      AutoDrive
    </span>
  </a>


  <div id="nav-list">

    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a
      routerLink="/cars"
      routerLinkActive="active"
    >
      Cars
    </a>

    <a
      routerLink="/brands"
      routerLinkActive="active"
    >
      Brands
    </a>

    <a
      routerLink="/compare"
      routerLinkActive="active"
    >
      Compare
    </a>

    <a routerLink="/test-drives" routerLinkActive="active">
      Test-drive
    </a>

    <a
      routerLink="/services"
      routerLinkActive="active"
    >
      Services
    </a>

    <a
      routerLink="/about"
      routerLinkActive="active"
    >
      About
    </a>

    <a
      routerLink="/contact"
      routerLinkActive="active"
    >
      Contact
    </a>

  </div>


  <div id="info">

    <button
      class="icon-button"
      aria-label="Search"
    >
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>

    <a
      routerLink="/favorites"
      routerLinkActive="active-icon"
      class="icon-button favorite-nav"
      aria-label="Wishlist"
    >

      <i class="fa-regular fa-heart"></i>

    </a>

    @if (auth.currentUser(); as user) {
      <a routerLink="/profile" class="avatar-link" [attr.aria-label]="'Tài khoản ' + user.fullName">
        <img [src]="user.avatarUrl || '/images/avt.jpg'" alt="User avatar" class="avatar" />
        <span class="account-name">{{ user.fullName }}</span>
      </a>
      <button type="button" class="sign-in-button" (click)="logout()">Đăng xuất</button>
    } @else {
      <a routerLink="/sign-in" class="sign-in-button">Sign In</a>
    }

  </div>

</nav>
