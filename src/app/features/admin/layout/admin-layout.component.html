<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><mat-icon>directions_car</mat-icon></div>
      <div>
        <div class="brand-name">AutoDrive</div>
        <div class="brand-sub">MANAGEMENT PORTAL</div>
      </div>
    </div>

    <nav class="nav-list">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="avatar-circle">{{ auth.currentUser()?.fullName?.charAt(0) }}</div>
      <div class="user-info">
        <div class="user-name">{{ auth.currentUser()?.fullName }}</div>
        <div class="user-role">Super Admin</div>
      </div>
      <button class="logout-btn" (click)="logout()" title="Đăng xuất">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="search-box">
        <mat-icon>search</mat-icon>
        <input type="text" placeholder="Search here..." />
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" matBadge="3" matBadgeColor="warn" matBadgeSize="small">
          <mat-icon>notifications</mat-icon>
        </button>

        <button class="user-chip" [matMenuTriggerFor]="userMenu">
          <div class="avatar-circle small">{{ auth.currentUser()?.fullName?.charAt(0) }}</div>
          <div class="user-chip-info">
            <div class="user-chip-name">{{ auth.currentUser()?.fullName }}</div>
            <div class="user-chip-role">Admin Manager</div>
          </div>
          <mat-icon>expand_more</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item routerLink="/admin/settings">
            <mat-icon>settings</mat-icon>
            <span>Cài đặt</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Đăng xuất</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
