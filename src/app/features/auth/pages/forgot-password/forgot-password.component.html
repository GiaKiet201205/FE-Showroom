<div class="auth-page">
  <header class="site-header">
    <div class="logo" aria-label="AutoDrive">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="2" /><path d="m9.5 9.5 5 5m0-5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
      </span>
      <span>AutoDrive</span>
    </div>
  </header>

  <main class="hero">
    <section class="auth-card" aria-labelledby="forgot-password-title">
      <span class="lock-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7.5 10V7a4.5 4.5 0 0 1 9 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" /><rect x="5.5" y="10" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="15" r="1.2" fill="currentColor" /></svg>
      </span>
      <h1 id="forgot-password-title">Forgot Password?</h1>
      <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" />
      </div>
      <button class="primary-button" type="button">Send Reset Link</button>
      <a class="back-link" routerLink="/sign-in">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m13.5 6-6 6 6 6M8 12h9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        Back to Sign In
      </a>
    </section>
  </main>
</div>
