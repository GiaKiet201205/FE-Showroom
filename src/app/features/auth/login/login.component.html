<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>AutoDrive</h1>
    <p class="subtitle">Đăng nhập khu vực quản trị</p>

    <label>Email</label>
    <input type="email" formControlName="email" placeholder="Vui lòng nhập email Admin" />
    @if (emailInvalid) {
      <span class="field-error">Vui lòng nhập email hợp lệ.</span>
    }

    <label>Mật khẩu</label>
    <input type="password" formControlName="password" placeholder="••••••••" />
    @if (passwordInvalid) {
      <span class="field-error">Mật khẩu tối thiểu 6 ký tự.</span>
    }

    @if (errorMessage) {
      <div class="form-error">{{ errorMessage }}</div>
    }

    <button type="submit" class="btn-primary" [disabled]="submitting">
      {{ submitting ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>
</div>
