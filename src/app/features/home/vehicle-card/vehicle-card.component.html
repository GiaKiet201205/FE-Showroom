<article
  class="vehicle-card"
  (click)="viewDetails()"
>

  <!-- ===================================== -->
  <!-- IMAGE -->
  <!-- ===================================== -->

  <div class="vehicle-image">

    <img
      [src]="
        vehicle.imageUrl ||
        '/images/no-image.jpg'
      "
      [alt]="
        vehicle.brand +
        ' ' +
        vehicle.model
      "
    >


    <button
      type="button"
      class="favorite-button"

      [class.active]="favoriteService.isFavorite(vehicle.id)"
      [attr.aria-pressed]="favoriteService.isFavorite(vehicle.id)"
      [attr.aria-label]="favoriteService.isFavorite(vehicle.id) ? 'Remove from favorites and comparison' : 'Add to favorites and comparison'"
      (click)="toggleFavorite($event)"
    >

      <i
        [class]="favoriteService.isFavorite(vehicle.id) ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"
      ></i>

    </button>

  </div>


  <!-- ===================================== -->
  <!-- CONTENT -->
  <!-- ===================================== -->

  <div class="vehicle-content">

    <h3>

      {{ vehicle.brand }}
      {{ vehicle.model }}

    </h3>


    <p>

      {{ vehicle.year }}

      •

      {{
        vehicle.transmission || '-'
      }}

    </p>


    <strong>

      {{
        vehicle.price
          | currency:
            'USD':
            'symbol':
            '1.0-0'
      }}

    </strong>

  </div>

</article>
