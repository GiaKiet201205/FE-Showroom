<article
  class="vehicle-card"
  (click)="viewDetails()"
>

  <!-- ===================================== -->
  <!-- IMAGE -->
  <!-- ===================================== -->

  <div class="vehicle-image">

    <img
      [src]="
        vehicle.imageUrl ||
        '/images/no-image.jpg'
      "
      [alt]="
        vehicle.brand +
        ' ' +
        vehicle.model
      "
    >


    <button
      type="button"
      class="favorite-button"

      aria-label="Add to wishlist"

      (click)="
        $event.stopPropagation()
      "
    >

      <i
        class="fa-regular fa-heart"
      ></i>

    </button>

  </div>


  <!-- ===================================== -->
  <!-- CONTENT -->
  <!-- ===================================== -->

  <div class="vehicle-content">

    <h3>

      {{ vehicle.brand }}
      {{ vehicle.model }}

    </h3>


    <p>

      {{ vehicle.year }}

      •

      {{
        vehicle.transmission || '-'
      }}

    </p>


    <p>Xe mới 100% · {{ vehicle.stockQuantity > 0 ? ('Còn ' + vehicle.stockQuantity + ' xe') : 'Hết hàng' }}</p>

    <strong>

      {{
        vehicle.price
          | currency:
            'USD':
            'symbol':
            '1.0-0'
      }}

    </strong>

  </div>

</article>
